name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # Includes the TypeScript typecheck (see package.json's build script).
      - run: npm run build

      - run: npm run lint
